<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nueva contraseña — Arepazo de Carlitos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
         background:#1a1008;font-family:'Lato',sans-serif;padding:24px}
    .card{background:#2a1c0e;border:1px solid #3a2810;border-radius:16px;
          padding:40px 36px;max-width:440px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.6)}
    .brand{text-align:center;margin-bottom:28px}
    .brand-icon{width:60px;height:60px;border-radius:50%;
                background:linear-gradient(135deg,#c8963e,#e8b96a);
                display:flex;align-items:center;justify-content:center;
                margin:0 auto 14px;font-size:24px;color:#1a1008}
    .brand h1{font-family:'Playfair Display',serif;color:#f5e6c8;font-size:22px;margin-bottom:4px}
    .brand p{color:#9a7a52;font-size:13px}
    .aviso{background:#1a2a3a;border:1px solid #1565c0;border-radius:10px;
           padding:12px 16px;font-size:13px;color:#90caf9;margin-bottom:20px;line-height:1.6}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:12px;color:#c8a87a;font-weight:700;
                 text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
    .field label i{margin-right:6px;color:#c8963e}
    .pass-wrap{position:relative}
    .field input{width:100%;background:#1a1008;border:1px solid #3a2810;border-radius:10px;
                 padding:12px 44px 12px 16px;color:#f5e6c8;font-size:15px;
                 outline:none;transition:border .2s,box-shadow .2s}
    .field input:focus{border-color:#c8963e;box-shadow:0 0 0 3px rgba(200,150,62,.15)}
    .pass-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);
                 background:none;border:none;cursor:pointer;color:#7a6040;font-size:15px;
                 transition:color .2s}
    .pass-toggle:hover{color:#c8963e}
    .strength{height:4px;border-radius:2px;margin-top:6px;transition:all .3s;background:#3a2810}
    .strength-text{font-size:11px;color:#9a7a52;margin-top:4px}
    .alert{background:#5c1a1a;border:1px solid #8b3030;color:#ffaaaa;
           padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
    .btn{width:100%;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:700;
         cursor:pointer;background:linear-gradient(135deg,#c8963e,#e8b96a);
         color:#1a1008;transition:opacity .2s;margin-top:4px}
    .btn:hover{opacity:.88}
    .btn:disabled{opacity:.5;cursor:not-allowed}
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-icon"><i class="fas fa-lock"></i></div>
    <h1>Nueva contraseña</h1>
    <p>Hola, <strong style="color:#c8963e">{{ session.username }}</strong></p>
  </div>

  <div class="aviso">
    <i class="fas fa-shield-alt" style="margin-right:8px"></i>
    Por seguridad debes establecer una nueva contraseña antes de continuar.
    El código de emergencia que usaste ya no es válido.
  </div>

  <div class="alert" id="alert"></div>

  <div class="field">
    <label><i class="fas fa-lock"></i>Nueva contraseña</label>
    <div class="pass-wrap">
      <input type="password" id="nueva" placeholder="Mínimo 6 caracteres"
             oninput="checkStrength(this.value)" autocomplete="new-password"/>
      <button type="button" class="pass-toggle" onclick="toggle('nueva',this)">
        <i class="fas fa-eye"></i>
      </button>
    </div>
    <div class="strength" id="strength-bar"></div>
    <div class="strength-text" id="strength-text"></div>
  </div>

  <div class="field">
    <label><i class="fas fa-lock"></i>Repetir contraseña</label>
    <div class="pass-wrap">
      <input type="password" id="confirmar" placeholder="Repite la contraseña"
             autocomplete="new-password"/>
      <button type="button" class="pass-toggle" onclick="toggle('confirmar',this)">
        <i class="fas fa-eye"></i>
      </button>
    </div>
  </div>

  <button class="btn" id="btn" onclick="guardar()">
    <span id="btnText"><i class="fas fa-save"></i> Guardar contraseña</span>
  </button>
</div>

<script>
function toggle(id, btn) {
  const input = document.getElementById(id);
  const icon  = btn.querySelector('i');
  input.type  = input.type === 'password' ? 'text' : 'password';
  icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}

function checkStrength(val) {
  const bar  = document.getElementById('strength-bar');
  const txt  = document.getElementById('strength-text');
  if (!val) { bar.style.background='#3a2810'; bar.style.width='0'; txt.textContent=''; return; }
  let score = 0;
  if (val.length >= 6)  score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const levels = [
    {w:'20%', c:'#c62828', t:'Muy débil'},
    {w:'40%', c:'#e65100', t:'Débil'},
    {w:'60%', c:'#f9a825', t:'Moderada'},
    {w:'80%', c:'#2e7d32', t:'Fuerte'},
    {w:'100%',c:'#1b5e20', t:'Muy fuerte'},
  ];
  const l = levels[Math.min(score-1, 4)] || levels[0];
  bar.style.background = l.c;
  bar.style.width      = l.w;
  txt.textContent      = l.t;
  txt.style.color      = l.c;
}

async function guardar() {
  const nueva     = document.getElementById('nueva').value.trim();
  const confirmar = document.getElementById('confirmar').value.trim();
  const alertEl   = document.getElementById('alert');
  const btn       = document.getElementById('btn');
  const btnText   = document.getElementById('btnText');
  alertEl.style.display = 'none';

  if (!nueva || nueva.length < 6) {
    alertEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
    alertEl.style.display = 'block'; return;
  }
  if (nueva !== confirmar) {
    alertEl.textContent = 'Las contraseñas no coinciden.';
    alertEl.style.display = 'block'; return;
  }

  btn.disabled = true;
  btnText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

  try {
    const res  = await fetch('/api/cambiar-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({nueva, confirmar})
    });
    const data = await res.json();
    if (data.success) {
      btnText.innerHTML = '<i class="fas fa-check"></i> ¡Listo! Redirigiendo...';
      setTimeout(() => { window.location.href = data.redirect; }, 1000);
    } else {
      alertEl.textContent = data.message;
      alertEl.style.display = 'block';
      btn.disabled = false;
      btnText.innerHTML = '<i class="fas fa-save"></i> Guardar contraseña';
    }
  } catch {
    alertEl.textContent = 'Error de conexión.';
    alertEl.style.display = 'block';
    btn.disabled = false;
    btnText.innerHTML = '<i class="fas fa-save"></i> Guardar contraseña';
  }
}

document.getElementById('confirmar').addEventListener('keydown', e => {
  if (e.key === 'Enter') guardar();
});
</script>
</body>
</html>
