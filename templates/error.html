<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ codigo }} — Arepazo de Carlitos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#1a1008;color:#f5e6c8;font-family:'Lato',sans-serif;
         display:flex;align-items:center;justify-content:center;
         min-height:100vh;padding:24px;text-align:center}
    .card{background:#2a1c0e;border:1px solid #3a2810;border-radius:16px;
          padding:48px 40px;max-width:440px;width:100%}
    .code{font-family:'Playfair Display',serif;font-size:72px;
          color:#c8963e;line-height:1;margin-bottom:12px}
    h1{font-family:'Playfair Display',serif;font-size:24px;
       color:#e8b96a;margin-bottom:12px}
    p{color:#9a7a52;font-size:15px;line-height:1.6;margin-bottom:28px}
    .btn{display:inline-block;background:linear-gradient(135deg,#c8963e,#e8b96a);
         color:#1a1008;font-weight:700;padding:12px 28px;border-radius:10px;
         text-decoration:none;font-size:14px;transition:opacity .2s}
    .btn:hover{opacity:.85}
    .sep{color:#3a2810;margin:0 10px}
    .btn-ghost{display:inline-block;color:#9a7a52;font-size:14px;
               text-decoration:none;padding:12px 20px}
    .btn-ghost:hover{color:#f5e6c8}
  </style>
</head>
<body>
  <div class="card">
    <div class="code">{{ codigo }}</div>
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    <a href="/dashboard" class="btn">Ir al dashboard</a>
    <span class="sep">·</span>
    <a href="/" class="btn-ghost">Inicio</a>
  </div>
</body>
</html>
